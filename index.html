<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТҮПНҰСҚАЛЫҚТЫ АНЫҚТАУ МОДУЛІ | АҚТӨБЕ ҚАЛАСЫНЫҢ БІЛІМ БӨЛІМІ</title>
    <style>
        :root {
            --primary-bg: #f8fafc;
            --accent-blue: #0284c7;
            --accent-hover: #0369a1;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --deep-blue: #0f172a;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--primary-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo-circle {
            height: 42px;
            width: 42px;
            object-fit: contain;
            border-radius: 50%;
        }

        .header-logo-rect {
            height: 38px;
            object-fit: contain;
        }

        .header-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--deep-blue);
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .main-logo-circle {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .main-logo-rect {
            height: 52px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.45rem;
            color: var(--deep-blue);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background-color: #fafafa;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .result-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .result-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://aktobebilim.github.io/aktobe_logo.jpg" alt="Ақтөбе қаласының білім бөлімі" class="header-logo-circle" onerror="this.onerror=null; this.src='эмблема горооо (2).png';">
            <div>
                <div class="header-title">АҚТӨБЕ ҚАЛАСЫНЫҢ БІЛІМ БӨЛІМІ</div>
                <div class="header-subtitle">«BILIM QAZYNA» КММ</div>
            </div>
        </div>
        <img src="https://aktobebilim.github.io/bilim_logo.png" alt="Bilim Qazyna" class="header-logo-rect" onerror="this.style.display='none'">
    </header>

    <main>
        <div class="container">
            <div class="main-logos">
                <img src="https://aktobebilim.github.io/aktobe_logo.jpg" alt="Ақтөбе қаласының білім бөлімі" class="main-logo-circle" onerror="this.style.display='none'">
                <img src="https://aktobebilim.github.io/bilim_logo.png" alt="Bilim Qazyna" class="main-logo-rect" onerror="this.style.display='none'">
            </div>
            <h1>Түпнұсқалықты анықтау модулі</h1>
            <p>Құжаттың немесе сертификаттың түпнұсқалығын тексеру үшін сәйкестендіру нөмірін енгізіңіз</p>
            
            <div class="input-group">
                <label for="docId">Құжат нөмірі немесе шифры</label>
                <input type="text" id="docId" placeholder="Мысалы: AKT-2026-001">
            </div>

            <button onclick="checkDocument()">Тексеру</button>
            <div id="resultBox" class="result-box"></div>
        </div>
    </main>

    <footer>
        &copy; 2026 «BILIM QAZYNA» коммуналдық мемлекеттік мекемесі. Барлық құқықтар қорғалған.
    </footer>

    <script>
        function checkDocument() {
            const val = document.getElementById('docId').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            if(!val) {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box result-error';
                resultBox.innerHTML = 'Құжат нөмірін енгізіңіз!';
                return;
            }
            
            resultBox.style.display = 'block';
            resultBox.className = 'result-box result-success';
            resultBox.innerHTML = '✓ «' + val + '» нөмірлі құжат жүйеде табылды және түпнұсқа болып табылады.';
        }
    </script>
</body>
</html>
